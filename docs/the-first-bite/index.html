document.getElementById('lock').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go');
  const msg = document.getElementById('msg');
  go.disabled = true;
  msg.textContent = 'Unlocking…';
  try {
    const raw = await hashwasm.argon2id({
      password: document.getElementById('pass').value,
      salt: bytes(payload.salt),
      iterations: payload.kdf.iterations,
      memorySize: payload.kdf.memorySize,
      parallelism: payload.kdf.parallelism,
      hashLength: payload.kdf.hashLength,
      outputType: 'binary',
    });
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.nonce) }, key, bytes(payload.data));
    const frame = document.createElement('iframe');
    frame.title = document.title;
    frame.src = URL.createObjectURL(new Blob([plain], { type: 'text/html' }));
    document.body.replaceChildren(frame);
  } catch (err) {
    msg.textContent = "That passphrase didn't work.";
    go.disabled = false;
  }
});
